# Builds the host app's .deb and .rpm (host/packaging/build-packages.sh) on every push
# and pull request that touches the app, and keeps them as a run artifact. Pushing a
# host-v* tag also publishes them as a release on git.hazaar.dev, with notes listing the app's
# commits since its previous release (.github/scripts/release-notes.sh):
#
#   (bump version in host/Cargo.toml, commit)
#   git tag host-v1.2.3 && git push origin main host-v1.2.3
#
# The tag must match host/Cargo.toml's version. Tags with a suffix (host-v1.2.3-beta.1)
# are published as prereleases. The firmware is released apart (firmware.yml); the app
# downloads it from those releases.
#
# Built on Ubuntu 22.04 so the binary runs on anything with glibc 2.35 or newer
# (Debian 12+, Ubuntu 22.04+, Fedora 36+).
name: Host packages

on:
  push:
    branches: [main]
    tags: ['host-v*']
    # Tag pushes always run; GitHub doesn't apply path filters to them.
    paths: &paths
      - 'host/**'
      - 'docs/**'
      - '.github/workflows/host-packages.yml'
      - '.github/scripts/**'
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  packages:
    name: Build .deb and .rpm
    # A release pushes the release commit to main and its tag together, and each
    # push starts a run. The tag's run builds the same commit and publishes it, so
    # the branch run for a release commit is skipped.
    if: >-
      ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') &&
        startsWith(github.event.head_commit.message, 'chore(release)')) }}
    runs-on: docker
    container:
      image: ubuntu:22.04
    steps:
      - name: Install tools
        # Node too, for the JavaScript actions: the Forgejo runner doesn't bring it.
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq curl ca-certificates git \
            build-essential pkg-config libudev-dev libfontconfig1-dev >/dev/null
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash - >/dev/null
          apt-get install -y -qq nodejs >/dev/null
          curl -fsSL https://sh.rustup.rs | sh -s -- -y -q --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: ${{ runner.os }}-host-${{ hashFiles('host/Cargo.lock') }}

      - name: Cache packaging tools
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: /opt/cargo-tools
          key: ${{ runner.os }}-cargo-deb-3.8.0-generate-rpm-0.21.1

      - name: Install packaging tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --root /opt/cargo-tools cargo-deb@3.8.0 cargo-generate-rpm@0.21.1

      - name: Work out the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#host-v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' host/Cargo.toml | head -1)
          [ "$VERSION" = "$CARGO_VERSION" ] || {
            echo "::error::Tag $TAG doesn't match host/Cargo.toml's version $CARGO_VERSION"; exit 1; }
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Test
        working-directory: host
        run: cargo test --locked

      - name: Build packages
        run: PATH="/opt/cargo-tools/bin:$PATH" host/packaging/build-packages.sh

      - name: Upload packages
        # v4 and later need GitHub's own artifact service, which Forgejo doesn't have.
        uses: actions/upload-artifact@v3
        with:
          name: nerd-deck-packages
          path: host/dist/

      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The checkout belongs to another uid than the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          notes=$(.github/scripts/release-notes.sh "$TAG" "$GITHUB_REPOSITORY")
          echo "$notes"
          { echo 'notes<<NOTES_END'; echo "$notes"; echo NOTES_END; } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          title: nerd-deck app ${{ env.VERSION }}
          release-dir: host/dist
          release-notes: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ env.PRERELEASE }}
