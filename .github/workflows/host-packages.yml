# Builds the device firmware, then the host app's .deb and .rpm with that firmware bundled
# (host/build.rs, host/packaging/build-packages.sh), on every push and pull request, and
# keeps them as a run artifact. Pushing a version tag also publishes them
# as a GitHub release, with notes listing every commit since the previous tag
# (host/packaging/release-notes.sh):
#
#   (bump version in host/Cargo.toml, commit)
#   git tag v1.2.3 && git push origin main v1.2.3
#
# The tag must match host/Cargo.toml's version. Tags with a suffix (v1.2.3-beta.1) are
# published as prereleases.
#
# Built on Ubuntu 22.04 so the binary runs on anything with glibc 2.35 or newer
# (Debian 12+, Ubuntu 22.04+, Fedora 36+).
name: Host packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    name: Build .deb and .rpm
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Install tools
        # GitHub mounts its own Node into the container for the JavaScript actions.
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq curl ca-certificates git \
            build-essential pkg-config libudev-dev python3 python3-venv >/dev/null
          curl -fsSL https://sh.rustup.rs | sh -s -- -y -q --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: ${{ runner.os }}-host-${{ hashFiles('host/Cargo.lock') }}

      - name: Cache packaging tools
        id: tools-cache
        uses: actions/cache@v6
        with:
          path: /opt/cargo-tools
          key: ${{ runner.os }}-cargo-deb-3.8.0-generate-rpm-0.21.1

      - name: Install packaging tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --root /opt/cargo-tools cargo-deb@3.8.0 cargo-generate-rpm@0.21.1

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-6.2.0-${{ hashFiles('firmware/platformio.ini') }}

      - name: Build firmware
        # The merged image (bootloader, partitions, app) the host bundles.
        run: |
          python3 -m venv /opt/pio
          /opt/pio/bin/pip install -q platformio==6.2.0
          /opt/pio/bin/pio run -d firmware
          echo "NERD_DECK_FIRMWARE=$GITHUB_WORKSPACE/firmware/.pio/build/wt32-sc01-plus/firmware-merged.bin" >> "$GITHUB_ENV"

      - name: Work out the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' host/Cargo.toml | head -1)
          [ "$VERSION" = "$CARGO_VERSION" ] || {
            echo "::error::Tag $TAG doesn't match host/Cargo.toml's version $CARGO_VERSION"; exit 1; }
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Test
        working-directory: host
        run: cargo test --locked

      - name: Build packages
        run: PATH="/opt/cargo-tools/bin:$PATH" host/packaging/build-packages.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nerd-deck-packages
          path: host/dist/

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The checkout belongs to another uid than the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          host/packaging/release-notes.sh "$TAG" "$GITHUB_REPOSITORY" > notes.md
          cat notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: nerd-deck ${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ env.PRERELEASE }}
          files: host/dist/*
