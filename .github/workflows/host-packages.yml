# Builds the host app's .deb and .rpm (host/packaging/build-packages.sh) on every push and
# pull request, and keeps them as a run artifact. Publishing a GitHub release also attaches
# them to that release:
#
#   (bump version in host/Cargo.toml, commit, push)
#   then on GitHub: Releases > Draft a new release > new tag v1.2.3 > Publish
#
# The tag must match host/Cargo.toml's version, or the run fails and nothing is attached.
#
# Built on Ubuntu 22.04 so the binary runs on anything with glibc 2.35 or newer
# (Debian 12+, Ubuntu 22.04+, Fedora 36+).
name: Host packages

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    name: Build .deb and .rpm
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
    steps:
      - name: Install tools
        # GitHub mounts its own Node into the container for the JavaScript actions.
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq curl ca-certificates git \
            build-essential pkg-config libudev-dev >/dev/null
          curl -fsSL https://sh.rustup.rs | sh -s -- -y -q --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            host/target
          key: ${{ runner.os }}-host-${{ hashFiles('host/Cargo.lock') }}

      - name: Cache packaging tools
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: /opt/cargo-tools
          key: ${{ runner.os }}-cargo-deb-3.8.0-generate-rpm-0.21.1

      - name: Install packaging tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --root /opt/cargo-tools cargo-deb@3.8.0 cargo-generate-rpm@0.21.1

      - name: Check the version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' host/Cargo.toml | head -1)
          [ "${TAG#v}" = "$CARGO_VERSION" ] || {
            echo "::error::Release tag $TAG doesn't match host/Cargo.toml's version $CARGO_VERSION"; exit 1; }

      - name: Test
        working-directory: host
        run: cargo test --locked

      - name: Build packages
        run: PATH="/opt/cargo-tools/bin:$PATH" host/packaging/build-packages.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nerd-deck-packages
          path: host/dist/

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          # Only adds files; the release's title and notes stay as written on GitHub.
          tag_name: ${{ github.event.release.tag_name }}
          files: host/dist/*
