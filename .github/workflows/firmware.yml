# Builds the device firmware (firmware/package.sh) on every push and pull request
# that touches it, and keeps it as a run artifact. Pushing a firmware-v* tag also
# publishes it as a GitHub release, with notes listing the firmware's commits since
# its previous release (.github/scripts/release-notes.sh):
#
#   (bump FW_VERSION in firmware/src/config.hpp, commit)
#   git tag firmware-v1.2.3 && git push origin main firmware-v1.2.3
#
# The tag must match FW_VERSION. Tags with a suffix (firmware-v1.2.3-beta.1) are
# published as prereleases, which the app ignores. The app is released apart
# (host-packages.yml) and downloads the newest firmware that speaks its protocol
# (kProtoVersion) from these releases; when the protocol changes, release the app
# that speaks it first.
name: Firmware

on:
  push:
    branches: [main]
    tags: ['firmware-v*']
    # Tag pushes always run; GitHub doesn't apply path filters to them.
    paths: &paths
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - '.github/scripts/**'
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-6.2.0-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python3 -m venv /opt/pio
          # The S3 platform's esptool (4.11) imports intelhex without installing it.
          /opt/pio/bin/pip install -q platformio==6.2.0 intelhex

      - name: Work out the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#firmware-v}"
          FW_VERSION=$(sed -n 's/^#define FW_VERSION "\(.*\)"$/\1/p' firmware/src/config.hpp)
          [ "$VERSION" = "$FW_VERSION" ] || {
            echo "::error::Tag $TAG doesn't match FW_VERSION $FW_VERSION in firmware/src/config.hpp"; exit 1; }
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Build firmware
        run: PIO=/opt/pio/bin/pio firmware/package.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: nerd-deck-firmware
          path: firmware/dist/

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          .github/scripts/release-notes.sh "$TAG" "$GITHUB_REPOSITORY" > notes.md
          cat notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: nerd-deck firmware ${{ env.VERSION }}
          body_path: notes.md
          prerelease: ${{ env.PRERELEASE }}
          make_latest: false
          files: firmware/dist/*
