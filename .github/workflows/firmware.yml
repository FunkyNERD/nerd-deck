# Builds the device firmware (firmware/package.sh) on every push and pull request
# that touches it, and keeps it as a run artifact. Pushing a firmware-v* tag also
# publishes it as a release on git.hazaar.dev, with notes listing the firmware's
# commits since its previous release (.github/scripts/release-notes.sh):
#
#   (bump FW_VERSION in firmware/src/config.hpp, commit)
#   git tag firmware-v1.2.3 && git push origin main firmware-v1.2.3
#
# The tag must match FW_VERSION. Tags with a suffix (firmware-v1.2.3-beta.1) are
# published as prereleases, which the app ignores. The app is released apart
# (host-packages.yml) and downloads the newest firmware that speaks its protocol
# (kProtoVersion) from these releases; when the protocol changes, release the app
# that speaks it first.
name: Firmware

on:
  push:
    branches: [main]
    tags: ['firmware-v*']
    # Tag pushes always run; GitHub doesn't apply path filters to them.
    paths: &paths
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
      - '.github/scripts/**'
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  firmware:
    name: Build firmware
    runs-on: docker
    # The runner's own image is Alpine, whose musl the ESP32 toolchains can't run on.
    container:
      image: ubuntu:22.04
    steps:
      - name: Install tools
        # Node for the JavaScript actions; Python for PlatformIO.
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq curl ca-certificates git python3 python3-venv >/dev/null
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash - >/dev/null
          apt-get install -y -qq nodejs >/dev/null

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-6.2.0-${{ hashFiles('firmware/platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python3 -m venv /opt/pio
          # The S3 platform's esptool (4.11) imports intelhex without installing it.
          /opt/pio/bin/pip install -q platformio==6.2.0 intelhex

      - name: Work out the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#firmware-v}"
          FW_VERSION=$(sed -n 's/^#define FW_VERSION "\(.*\)"$/\1/p' firmware/src/config.hpp)
          [ "$VERSION" = "$FW_VERSION" ] || {
            echo "::error::Tag $TAG doesn't match FW_VERSION $FW_VERSION in firmware/src/config.hpp"; exit 1; }
          PRERELEASE=false
          case "$VERSION" in *-*) PRERELEASE=true ;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"

      - name: Build firmware
        run: PIO=/opt/pio/bin/pio firmware/package.sh

      - name: Upload firmware
        # v4 and later need GitHub's own artifact service, which Forgejo doesn't have.
        uses: actions/upload-artifact@v3
        with:
          name: nerd-deck-firmware
          path: firmware/dist/

      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The checkout belongs to another uid than the container's root.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          notes=$(.github/scripts/release-notes.sh "$TAG" "$GITHUB_REPOSITORY")
          echo "$notes"
          { echo 'notes<<NOTES_END'; echo "$notes"; echo NOTES_END; } >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/forgejo-release@v2
        with:
          direction: upload
          title: nerd-deck firmware ${{ env.VERSION }}
          release-dir: firmware/dist
          release-notes: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ env.PRERELEASE }}
