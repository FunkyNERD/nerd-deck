; nerd-deck firmware for the WT32-SC01 Plus
; (ESP32-S3-WROVER-N16R2, 3.5" 480x320 ST7796 over 8-bit parallel, FT6336U touch)

[env:wt32-sc01-plus]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -I include
    -DBOARD_HAS_PSRAM
    ; USB-C on this board goes to the S3's native USB-Serial-JTAG peripheral.
    ; `Serial` becomes HWCDC and enumerates as 303a:1001.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; `Serial` carries the host protocol, so keep core logging off it.
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINOJSON_USE_LONG_LONG=1

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@~8.3.11
    bblanchon/ArduinoJson@^7.2.0
