; nerd-deck firmware, one build environment per board. Each sets FW_BOARD to its
; own name, which the deck reports in `hello` and the release file carries, so
; the host only installs a board's own firmware.

[env]
framework = arduino
extra_scripts = post:merge_firmware.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -I include
    ; USB-C goes to the chip's native USB-Serial-JTAG peripheral.
    ; `Serial` becomes HWCDC and enumerates as 303a:1001.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; `Serial` carries the host protocol, so keep core logging off it.
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINOJSON_USE_LONG_LONG=1
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@~8.3.11
    bblanchon/ArduinoJson@^7.2.0

; WT32-SC01 Plus: ESP32-S3-WROVER-N16R2, 3.5" 480x320 ST7796 over 8-bit
; parallel, FT6336U touch.
[env:wt32-sc01-plus]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -DFW_BOARD=\"wt32-sc01-plus\"
    -DBOARD_HAS_PSRAM

; Waveshare ESP32-C5-Touch-LCD-3.5: ESP32-C5-WROOM-1 (32 MB flash, 8 MB PSRAM),
; 3.5" 480x320 ST7796 over SPI, FT6336 touch. The C5 needs Arduino core 3.x,
; which comes with the pioarduino platform.
[env:waveshare-c5-touch-35]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c5-devkitc-1
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -DFW_BOARD=\"waveshare-c5-touch-35\"
    -DBOARD_WAVESHARE_C5_TOUCH_35
    -DBOARD_HAS_PSRAM
