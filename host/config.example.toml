# nerd-deck writes this to ~/.config/nerd-deck/config.toml on first start if
# there's no config yet. After editing, choose Reload config in the tray icon
# (or restart the service).

[device]
# port = "/dev/ttyACM0"   # skip auto-detection
vid = 0x303a              # Espressif
pid = 0x1001              # USB-Serial-JTAG (ESP32-S3 native USB)
baud = 115200

[stats]
interval_ms = 1000
# interface = "enp5s0"    # default: busiest non-loopback interface
mounts = ["/", "/home"]   # the device shows up to 4
removable = true          # also show USB drives / SD cards while mounted
battery = true            # show the battery reading in the header, on PCs that have one

[updates]
check = true              # look for a newer release daily and show a notice on the device
firmware = true           # download new device firmware from the releases and install it when the device's is older

[notifications]
enabled = false           # also show desktop notifications (new mail, chat, ...) on the device
apps = []                 # only these apps, e.g. ["Geary", "Thunderbird"]; empty = all apps
ignore = []               # never these apps, e.g. ["Spotify"]
body = true               # false shows just the app and title, not the message text
dnd = true                # hold them back while Do Not Disturb is on (critical ones still show)
skip_low = true           # leave out low-urgency ones (connection changes and the like)
# The log names each app as its notifications arrive:
#   journalctl --user -u nerd-deck | grep notification

# Up to 12 buttons, laid out 4x3 on the Controls tab in this order.
# Commands run via `sh -c` as the user running nerd-deck.
#
# Each button can show either:
#   icon  = a built-in symbol name (an unknown name lists the valid ones), e.g.
#           audio video play pause stop prev next mute volume_mid volume_max
#           power settings home refresh keyboard wifi bluetooth usb bell
#           envelope file directory save edit trash eye_open eye_close ...
#   image = a PNG/JPEG/BMP that fills the whole button, cropped to fit. `~/`
#           works; relative paths are relative to this file.
# and its label can have a colour: color = "#FFA726"

[[button]]
id = "lock"
label = "Lock"
command = "loginctl lock-session"
icon = "eye_close"

[[button]]
id = "mute"
label = "Mute"
command = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
icon = "mute"

[[button]]
id = "vol_down"
label = "Vol -"
command = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
icon = "volume_mid"

[[button]]
id = "vol_up"
label = "Vol +"
command = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+"
icon = "volume_max"

[[button]]
id = "play_pause"
label = "Play / Pause"
command = "playerctl play-pause"
icon = "play"

[[button]]
id = "terminal"
label = "Terminal"
command = "x-terminal-emulator"
icon = "keyboard"
# image = "icons/terminal.png"   # instead of icon

[[button]]
id = "suspend"
label = "Suspend"
command = "systemctl suspend"
icon = "power"

# Custom tabs: up to 3, each a grid of panels that show what a web page, an
# API or a command says. They join the deck's tabs, and the settings window
# orders them and turns them on and off like the others. A panel is only
# refreshed while its tab is on, at its own interval, whatever the stats
# interval.
#
#   [[tab]]
#   id = "infra"            # 1-15 letters, digits, - or _
#   name = "Infra"          # on the deck's header, up to 15 bytes
#   icon = "list"           # a symbol name, as for buttons
#   grid = [2, 2]           # columns x rows, up to 4 x 3; panels fill it in order
#   interval = 60           # seconds between refreshes, for each panel
#
# Each panel has a kind:
#   url     = a value from a web page or API: its first line, or `json`, a
#             JSON Pointer into it ("/data/0/price"); `sub_json` points at a
#             note shown under it. `headers` go with the request (API keys).
#   status  = whether `url` answers: its status code and how fast, green, or
#             orange slower than `slow_ms` (1000), or red. `status_text = true`
#             shows its reason ("Not Found") in place of the code.
#   command = the first line a command prints (`sh -c`, like a button's).
#   text    = `text`, as it is.
# and can set: title, span = [columns, rows], interval (at least 5 s for url
# and status, 1 s for command), timeout (seconds, 10), and for numbers:
# prefix ("$", before it), unit (" mm", after it), decimals, and warn / crit,
# from which it shows orange / red (below them when crit is the lower).
# docs/CUSTOM-TABS.md has them all, with examples.
#
#   [[tab.panel]]
#   kind = "status"
#   title = "Git"
#   url = "https://git.example.com"
#   interval = 30
#
#   [[tab.panel]]
#   kind = "command"
#   title = "Load"
#   command = "cut -d' ' -f1 /proc/loadavg"
#   decimals = 2
#   warn = 4.0
#   crit = 8.0
#   interval = 5
#
#   [[tab.panel]]
#   kind = "url"
#   title = "Bitcoin"
#   url = "https://api.coinbase.com/v2/prices/BTC-USD/spot"
#   json = "/data/amount"
#   prefix = "$"
#   unit = " USD"
#   decimals = 0
#   span = [2, 1]
